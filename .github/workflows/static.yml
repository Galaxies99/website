# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R CNAME index.html stylesheet.css data images history notes s2i FoAR ved _site/
          find _site/ved/resources/videos/plate -maxdepth 1 -type f -name '*.mp4' -delete
          touch _site/.nojekyll
          test -s _site/data/cv.pdf
          test -s _site/ved/index.html
          for method in rise mask noaug aug; do
            test -s "_site/ved/resources/videos/plate/web/plate-mild-${method}.mp4"
            for sample in 1 2; do
              test -s "_site/ved/resources/videos/plate/web/plate-large-${method}-${sample}.mp4"
            done
          done
          for method in vanilla mask noaug aug; do
            for sample in 4 20; do
              test -s "_site/ved/resources/videos/pour/web/pour-${method}-${sample}.mp4"
            done
          done
          chmod -R a+rX _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
